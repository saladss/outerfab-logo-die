MACROS:
  # required: will be replaced with actual content
  gf180mcu_ws_ip__qrcode_id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/gds/gf180mcu_ws_ip__qrcode_id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/lef/gf180mcu_ws_ip__qrcode_id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/vh/gf180mcu_ws_ip__qrcode_id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__qrcode_id/lib/gf180mcu_ws_ip__qrcode_id.lib
    instances:
      qrcode_id:
        location: [26, 26]
        orientation: N

  # required: will be replaced with actual content
  gf180mcu_ws_ip__shuttle_id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__shuttle_id/gds/gf180mcu_ws_ip__shuttle_id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__shuttle_id/lef/gf180mcu_ws_ip__shuttle_id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__shuttle_id/vh/gf180mcu_ws_ip__shuttle_id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__shuttle_id/lib/gf180mcu_ws_ip__shuttle_id.lib
    instances:
      shuttle_id:
        location: [26, 175.6]
        orientation: E

  # required: will be replaced with actual content
  gf180mcu_ws_ip__project_id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__project_id/gds/gf180mcu_ws_ip__project_id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__project_id/lef/gf180mcu_ws_ip__project_id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__project_id/vh/gf180mcu_ws_ip__project_id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__project_id/lib/gf180mcu_ws_ip__project_id.lib
    instances:
      project_id:
        location: [175.6, 26]
        orientation: N

  # required: top right corner marker
  gf180mcu_ws_ip__marker:
    gds:
      - dir::../ip/gf180mcu_ws_ip__marker/gds/gf180mcu_ws_ip__marker.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__marker/lef/gf180mcu_ws_ip__marker.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__marker/vh/gf180mcu_ws_ip__marker.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__marker/lib/gf180mcu_ws_ip__marker.lib
    instances:
      marker:
        location: ["expr::($DIE_AREA[2] - (245 + 36))", "expr::($DIE_AREA[3] - (245 + 36))"]
        orientation: N

  gf180mcu_ws_ip__logo:
    gds:
      - dir::../ip/gf180mcu_ws_ip__logo/gds/gf180mcu_ws_ip__logo.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__logo/lef/gf180mcu_ws_ip__logo.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__logo/vh/gf180mcu_ws_ip__logo.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__logo/lib/gf180mcu_ws_ip__logo.lib
    instances:
      wafer_space_logo:
        location: [26, "expr::$DIE_AREA[3] - 169.25"]
        orientation: N

  # outerfab logo: chirped Metal5 grating, no ports. Centred on the 1x0.5 die.
  outerfab_logo:
    gds:
      - dir::../ip/outerfab_logo/gds/outerfab_logo.gds
    lef:
      - dir::../ip/outerfab_logo/lef/outerfab_logo.lef
    vh:
      - dir::../ip/outerfab_logo/vh/outerfab_logo.v
    lib:
      "*":
        - dir::../ip/outerfab_logo/lib/outerfab_logo.lib
    instances:
      outerfab_logo:
        location: ["expr::($DIE_AREA[2] - 1900) / 2", "expr::($DIE_AREA[3] - 1094.5) / 2"]
        orientation: N

  # Founder portraits above/below the VGA macro, on the same vertical axis as it
  # (VGA at x=CORE_AREA[2]-510, y=(DIE_AREA[3]-500)/2, 500x500).
  portrait_stuart:
    gds:
      - dir::../ip/portraits/gds/portrait_stuart.gds
    lef:
      - dir::../ip/portraits/lef/portrait_stuart.lef
    vh:
      - dir::../ip/portraits/vh/portrait_stuart.v
    lib:
      "*":
        - dir::../ip/portraits/lib/portrait_stuart.lib
    instances:
      portrait_stuart:
        location: ["expr::$CORE_AREA[2] - 510 + (500 - 408.0) / 2",
                   "expr::($DIE_AREA[3] - 500) / 2 + 500 + 10 + ($CORE_AREA[3] - (($DIE_AREA[3] - 500) / 2 + 500 + 10) - 540) / 2"]
        orientation: N

  portrait_giovanni:
    gds:
      - dir::../ip/portraits/gds/portrait_giovanni.gds
    lef:
      - dir::../ip/portraits/lef/portrait_giovanni.lef
    vh:
      - dir::../ip/portraits/vh/portrait_giovanni.v
    lib:
      "*":
        - dir::../ip/portraits/lib/portrait_giovanni.lib
    instances:
      portrait_giovanni:
        location: ["expr::$CORE_AREA[2] - 510 + (500 - 403.5) / 2",
                   "expr::$CORE_AREA[1] + (($DIE_AREA[3] - 500) / 2 - 10 - $CORE_AREA[1] - 540) / 2"]
        orientation: N

  # VGA screensaver, hardened separately: `make vga`
  wrapped_vga:
    gds:
      - dir::../vga_screensaver/runs/latest/final/gds/wrapped_vga.gds
    lef:
      - dir::../vga_screensaver/runs/latest/final/lef/wrapped_vga.lef
    pnl:
      - dir::../vga_screensaver/runs/latest/final/pnl/wrapped_vga.pnl.v
    nl:
      - dir::../vga_screensaver/runs/latest/final/nl/wrapped_vga.nl.v
    spef:
      min_*: dir::../vga_screensaver/runs/latest/final/spef/min/wrapped_vga.min.spef
      nom_*: dir::../vga_screensaver/runs/latest/final/spef/nom/wrapped_vga.nom.spef
      max_*: dir::../vga_screensaver/runs/latest/final/spef/max/wrapped_vga.max.spef
    lib:
      "*_tt_025C_5v00": dir::../vga_screensaver/runs/latest/final/lib/nom_tt_025C_5v00/wrapped_vga__nom_tt_025C_5v00.lib
      "*_ss_125C_4v50": dir::../vga_screensaver/runs/latest/final/lib/nom_ss_125C_4v50/wrapped_vga__nom_ss_125C_4v50.lib
      "*_ff_n40C_5v50": dir::../vga_screensaver/runs/latest/final/lib/nom_ff_n40C_5v50/wrapped_vga__nom_ff_n40C_5v50.lib
    instances:
      # right-hand column, vertically centred in the core; room above/below for more art
      i_chip_core.vga:
        location: ["expr::$CORE_AREA[2] - 510", "expr::($DIE_AREA[3] - 500) / 2"]
        orientation: N
