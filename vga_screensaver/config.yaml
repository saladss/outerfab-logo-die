meta:
  version: 3
  flow: Classic
  substituting_steps:
    +Magic.DRC: KLayout.Antenna
    +Checker.MagicDRC: Checker.KLayoutAntenna

DESIGN_NAME: wrapped_vga
VERILOG_FILES:
  - dir::wrapped_vga.v
  - dir::src/tt_um_outerfab_vga_screensaver.v
  - dir::src/bitmap_rom.v
  - dir::src/gamepad_pmod.v
  - dir::src/palette.v
  - dir::src/vga_sync_generator.v

CLOCK_PORT: clk_i
CLOCK_NET: clk_i
CLOCK_PERIOD: 39.7 # 25.175 MHz
PNR_SDC_FILE: dir::base.sdc
SIGNOFF_SDC_FILE: dir::base.sdc

FP_SIZING: absolute
DIE_AREA: [0, 0, 500, 500]
FP_PIN_ORDER_CFG: dir::pin_order.cfg
FP_IO_HLAYER: Metal3
FP_IO_VLAYER: Metal4
FP_PDN_MULTILAYER: false
RT_MAX_LAYER: Metal4

VDD_NETS: ["VDD"]
GND_NETS: ["VSS"]
VERILOG_POWER_DEFINE: "USE_POWER_PINS"

SYNTH_STRATEGY: DELAY 4
PL_RESIZER_SETUP_SLACK_MARGIN: 0.25
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.25
PL_RESIZER_HOLD_SLACK_MARGIN: 0.2
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.2
PL_RESIZER_HOLD_MAX_BUFFER_PCT: 100
GRT_ALLOW_CONGESTION: true
DESIGN_REPAIR_TIE_FANOUT: true
DIODE_ON_PORTS: both
RUN_CTS: true
ERROR_ON_KLAYOUT_DRC: true
RUN_MAGIC_DRC: true
